<body>
   <div class="header_section header_bg">
      <div class="container-fluid">
         <div id="menu"></div>
      </div>
   </div>
   <!-- header section end -->
   <!-- contact section start -->
   <div class="contact_section layout_padding">
      <div class="container">
         <div class="row">
            <div class="col-sm-12">
               <h1 class="contact_taital contact_heading">Cadastro Imunização</h1>
            </div>
         </div>
         <div class="contact_section_2">

            <div class="row">
               <div class="col-md-12">
                  <div class="mail_section map_form_container">
                
                        <form method="post" onsubmit="cadastrarImunizacoes(event)" id="imunizacoes">
                           <div class="row">
                              <div class="input-group mb-3">

                                 <select id="pacienteSelect" class="form-select mail_text">
                                    <option value="">Selecione um paciente</option>
                                 </select>
                              </div>
                              <div class="col-md-8">
                                 <select id="doseSelect" class="form-select mail_text">
                                    <option value="">Selecione um paciente</option>
                                 </select>
                              </div>
                              <div class="col-md-4">
                                 <input type="date" class="mail_text" placeholder="Data Aplicação" name="dataAplicacao">
                              </div>
                              <div class="col-md-9">
                                 <select name="fabricante" class="form-select mail_text">
                                    <option value="">Selecione Fabricante</option>
                                    <option value="Johnson & Johnson">Johnson & Johnson</option>
                                    <option value="Pfizer">Pfizer</option>
                                    <option value="Moderna">Moderna</option>
                                    <option value="AstraZeneca">AstraZeneca</option>
                                    <option value="Sinovac">Sinovac</option>
                                    <option value="Sinopharm">Sinopharm</option>
                                    <option value="GlaxoSmithKline (GSK)">GlaxoSmithKline (GSK)</option>
                                    <option value="Sanofi">Sanofi</option>
                                    <option value="Instituto Butantan">Instituto Butantan</option>
                                    <option value="Outro">Outro</option>
                                 </select>
                              </div>
                              <div class="col-md-3">
                                 <input type="text" class="mail_text" placeholder="lote" name="lote">
                              </div>
                              <div class="col-md-6">
                                 <input type="text" class="mail_text" placeholder="Local Aplicacao" name="localAplicacao">
                                
                              </div>
                              <div class="col-md-6">
                               
                                 <input type="text" class="mail_text" placeholder="Nome Profissional"
                                    name="profissionalAplicador">
                              
                           </div>
                           </div>
                           <br/>
                           <div class="row">
                              
                              <div class="col-md-4">
                                 <button type="submit" class="btn btn-lg btn-success ">Cadastrar</button>
                              
                           </div>
                        </form>
         

                     
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
   <!-- contact section end -->
   <!-- footer section start -->
   <div class="footer_section layout_padding ">
      <div class="container">
         <div class="row">
            <div class="col-md-12">
               <h2 class="useful_text text-danger">1000DEVs – Talentos para o Bem</h2>
            </div>
         </div>
         <div class="footer_section_2">
            <div class="row">
               <div class="col-lg-3 col-sm-6">
                  <div class="footer_menu">
                     <img src="../images/logo1000devs.png">
                  </div>
               </div>
               <div class="col-lg-3 col-sm-6">
                  <div class="footer_menu">
                     <img src="../images/logojj.png">
                  </div>
               </div>
               <div class="col-lg-3 col-sm-6">
                  <img src="../images/logomestra.png">
               </div>
               <div class="col-lg-3 col-sm-6">

                  <img src="../images/logohospital.png">
               </div>
            </div>
         </div>
      </div>
   </div>
   </div>

      <div class="container">

      </div>

   <script src="../js/jquery-3.0.0.min.js"></script>

   <!-- javascript -->
   <script>
      // Material Select Initialization
      $(document).ready(function () {
         $('.mdb-select').materialSelect();
         $('.select-wrapper.md-form.md-outline input.select-dropdown').bind('focus blur', function () {
            $(this).closest('.select-outline').find('label').toggleClass('active');
            $(this).closest('.select-outline').find('.caret').toggleClass('active');
         });
      });
   </script>
